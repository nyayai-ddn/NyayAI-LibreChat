# LibreChat Docker Compose Override Configuration
# This file adds Ollama to your LibreChat setup

networks:
  paralx-network:
    external: true
    name: paralx-network

services:
  api:
    # Build locally instead of pulling GHCR
    build:
      context: .
      dockerfile: Dockerfile
    image: nyayai-librechat-local:latest
    pull_policy: never
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./nyay-fm-config.yaml:/app/nyay-fm-config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
#     - OLLAMA_BASE_URL=http://ollama:11434  # Note: Changed to use Docker network
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # OCR service — referenced by the /api/nyay/ocr proxy routes
      - OCR_SERVICE_URL=http://nyay-ocr:8100
      - MATTER_SERVICE_URL=http://matter-service:8000
      - DOCUMENT_SERVICE_URL=http://document-service:8230
      - COPILOT_SERVICE_URL=http://ai-copilot-service:8220
      - LPMS_JWT_SECRET=${JWT_SECRET}
    networks:
      - default
      - paralx-network

  # Ollama service
  #ollama:
  #  image: ollama/ollama:latest
  #  container_name: LibreChat-Ollama
  #  restart: always
  #  ports:
  #    - "11434:11434"
  #  volumes:
  #    # - ./ollama:/root/.ollama  # Persistent storage for models
  #    - /Users/akshajg/.ollama:/root/.ollama  # Persistent storage for models
    # Uncomment below if you have NVIDIA GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # NyayAI OCR Service — Vernacular document extraction and translation
  nyay-ocr:
    build:
      context: ../NyayAI-LangTranslate-v1
      dockerfile: Dockerfile
    container_name: nyay-ocr
    restart: always
    ports:
      - "8100:8100"
    environment:
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - SARVAM_WEBHOOK_BASE_URL=${SARVAM_WEBHOOK_BASE_URL:-}
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=LibreChat
      - LIBRECHAT_FM_SAVE_URL=http://LibreChat:${PORT:-3080}/api/internal/fm-save
      - NYAY_SERVICE_KEY=${NYAY_SERVICE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MAX_PAGES=${OCR_MAX_PAGES:-10}
      - TRANSLATE_CHUNK_SIZE=1800
      - SUMMARY_MODEL=gpt-4.1-mini
      - LOG_LEVEL=INFO
    depends_on:
      - mongodb
      - api
    networks:
      - default
      - paralx-network

  #Mongo Express for DB management
  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb:27017/LibreChat
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=nyayai123   # change this
    depends_on:
      - mongodb