        stream: true
      description: "Constitutional law research — fundamental rights (Articles 12–35), proportionality, Article 14 arbitrariness, PIL, judicial review, legislative competence."
      greeting: |
        ⚖️ **Constitutional Law**

        Research on fundamental rights, proportionality doctrine, judicial review, and PIL.

        Describe the constitutional question — article invoked, state action challenged, petitioner — and I'll analyse the constitutional position with landmark authorities.

