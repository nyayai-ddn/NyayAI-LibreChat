version: 1.3.1
cache: true
fileStrategy: "local"

interface:
  customWelcome: 'Welcome to NyayAI! Your AI-powered legal assistant.'
  fileSearch: true
  # Keep endpointsMenu true so standard model picker still works for Naya-AI/Ollama
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: false

registration:
  socialLogins: ['github', 'google', 'discord', 'openid']

endpoints:
  custom:

    # ── Wills Drafting ─────────────────────────────────────────────────────────
    - name: "Wills Drafting"
      apiKey: "sk-will-backend-key-12345"
      baseURL: "http://willgen-api:8000/api"
      headers:
        X-LibreChat-Session: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
      models:
        default: ["Will Drafting Assistant"]
        fetch: false
      modelDisplayLabel: "Will Drafting Assistant"
      # ── NyayAI nav: section header label shown in the sidebar ──────────────
      group: "Drafting"
      titleConvo: true
      summarize: false
      forcePrompt: false
      dropParams:
        - user
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      addParams:
        max_tokens: 2000
        temperature: 0.7
      description: "Generate legal wills and estate documents"
      greeting: |
        👋 Welcome to Wills Drafting!

        I can help you create wills and estate planning documents.

        **Quick Commands:**
        - Ask: **"Draft a will for me"**
        - Ask: **"Update this will clause"**
        - Ask: **"Summarize the beneficiaries and assets"**

        📄 Start with your drafting instructions or upload supporting details.


    # ── Drafting Assistant ─────────────────────────────────────────────────────
    - name: "Drafting Assistant"
      apiKey: "drafting-assistant-dev-key"
      baseURL: "http://host.docker.internal:8004/v1"
      headers:
        X-LibreChat-Session: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
      models:
        default: ["Structured Drafting Assistant"]
        fetch: false
      modelDisplayLabel: "Structured Drafting Assistant"
      group: "Drafting"
      titleConvo: true
      titleModel: "Structured Drafting Assistant"
      summarize: false
      forcePrompt: false
      dropParams:
        - user
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      addParams:
        max_tokens: 4096
        temperature: 0.2
      description: "Structured legal document drafting with template-guided validation and draft generation"
      greeting: |
        👋 Welcome to the Drafting Assistant!

        I can guide you through structured legal drafting workflows.

        **Workflow:**
        - Select a document type
        - Review template requirements
        - Validate uploaded drafting inputs
        - Generate and revise a draft

        📑 Affidavit drafting is enabled first, with more document types coming soon.


    # ── Contract Review ────────────────────────────────────────────────────────
    - name: "Contract Review"
      apiKey: "legal-contract-dev-key"
      baseURL: "http://host.docker.internal:8001/v1"
      models:
        default: ["Tabular Contract Review"]
        fetch: false
      modelDisplayLabel: "Tabular Contract Review"
      # ── NyayAI nav: section header label shown in the sidebar ──────────────
      group: "Tabular Review"
      titleConvo: true
      titleModel: "Tabular Contract Review"
      summarize: false
      forcePrompt: false
      dropParams:
        - user
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      addParams:
        max_tokens: 4096
        temperature: 0.1
      description: "AI-powered contract analysis with risk detection and redlining"
      greeting: |
        👋 Welcome to the Legal Contract Analyzer!
        
        I can help you analyze contracts, identify risks, and generate redlines.
        
        **Quick Commands:**
        - Upload a file and say: **"Analyze this contract"** or **"Analyze the contract"**
        - Ask: **"What are the key risks?"** (after analysis)
        - Request: **"Generate redlines"** or **"Show redline suggestions"**
        - Search: **"Find termination clauses"** or **"Show liability provisions"**
        
        📎 Simply attach your PDF, DOCX, or TXT contract file and tell me what you'd like to do!


    # ── PageIndex Contract Analysis ────────────────────────────────────────────
    - name: "PageIndex Contract Analysis"
      apiKey: "legal-contract-dev-key"
      baseURL: "http://host.docker.internal:8001/v1"
      models:
        default: ["PageIndex Contract Analysis"]
        fetch: false
      modelDisplayLabel: "PageIndex Contract Analysis"
      group: "Tabular Review"
      titleConvo: true
      titleModel: "PageIndex Contract Analysis"
      summarize: false
      forcePrompt: false
      dropParams:
        - user
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      addParams:
        max_tokens: 4096
        temperature: 0.1
      description: "Ask any question about your contract and get page-linked, evidence-backed findings with a PDF preview"
      greeting: |
        👋 Welcome to **PageIndex Contract Analysis**!
        
        Upload your contract, then ask any question — for example:
        - **"What are the termination risks?"**
        - **"Summarise the confidentiality obligations"**
        - **"Which clauses create unlimited liability?"**
        
        I'll return page-linked findings with a live PDF preview on the right.


    # ── Legal Research ─────────────────────────────────────────────────────────
    - name: "Legal Research"
      apiKey: "legal-research-dev-key"
      baseURL: "http://host.docker.internal:8104/v1"
      models:
        default: ["legal-research"]
        fetch: false
      modelDisplayLabel: "Legal Research"
      # ── NyayAI nav: section header label shown in the sidebar ──────────────
      group: "Legal Research"
      titleConvo: true
      titleModel: "legal-research"
      summarize: false
      forcePrompt: false
      dropParams:
        - user
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      addParams:
        max_tokens: 16000
        temperature: 1.0
      description: "AI-powered legal research assistant for case law, statutes, and regulations"
      greeting: |
        👋 Welcome to the Legal Research Assistant!
        
        I can help you conduct legal research on case law, statutes, and regulations.
        
        **Quick Commands:**
        - Ask: **"Find relevant case law on [topic]"**
        - Ask: **"What are the key statutes related to [topic]?"**
        - Ask: **"Summarize the legal landscape on [topic]"**
        
        📚 Just tell me your research topic or question, and I'll get started!

    - name: "Legal Research v3"
      apiKey: "legal-research-dev-key"
      baseURL: "http://host.docker.internal:8103/v1"
      models:
        default: ["legal-research-v3"]
        fetch: false
      modelDisplayLabel: "Legal Research v3"
      group: "Legal Research"
      titleConvo: true
      titleModel: "legal-research-v3"
      summarize: false
      forcePrompt: false
      dropParams:
        - user
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      addParams:
        max_tokens: 16000
        temperature: 1.0
      description: "Agentic legal research workflow with live progress updates and provisional strategy support"
      greeting: |
        👋 Welcome to **Legal Research v3**!

        I can help you with an agentic legal research workflow that:
        - understands the matter facts,
        - asks targeted clarifications when needed,
        - retrieves supporting authorities,
        - and streams progress updates live.

        **Try asking:**
        - **"Need anticipatory bail strategy for a Delhi FIR under 498A"**
        - **"Research maintainability of a writ against blacklisting"**
        - **"Show supporting authorities for arbitration fraud exception"**
        
        ⚖️ I'll generate structured strategy cards anchored to retrieved authorities.


    # ── Legal Research Skills ───────────────────────────────────────────────────
    # All 6 skills route to nyay-legal-research backend (port 8106).
    # The "model" slug selects the SKILL.md (case-research, issue-analysis, etc.)

    - name: "Case Research"
      apiKey: "nyayai-research-key"
      baseURL: "http://host.docker.internal:8106/v1"
      headers:
        X-LibreChat-Session: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        X-LibreChat-User: '{{LIBRECHAT_USER_ID}}'
      models:
        default: ["nyay-case-research"]
        fetch: false
      modelDisplayLabel: "Case Research"
      titleConvo: true
      titleModel: "nyay-case-research"
      summarize: false
      forcePrompt: false
      dropParams:
        - user
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      addParams:
        max_tokens: 16000
        stream: true
      description: |
        Find and verify Indian case law across the Supreme Court and all High Courts.
        NyayAI's three-source citation pipeline ranks authorities by judicial hierarchy and flags negative treatment before output.
        Every citation is tagged [VERIFIED] or [VERIFY REQUIRED] — nothing unverified reaches your brief.
        Use when you need to identify the leading authorities on any legal proposition.
      greeting: |
        ⚖️ **Case Research**

        I retrieve and verify Indian case law using the NyayAI judgment corpus.
        Every citation is tagged [VERIFIED] or [VERIFY REQUIRED] before output.

        **Tell me the legal issue** — I'll return ranked authorities with bench composition, holdings, and a research memo.

        Example: *"Section 74 ICA 1872 liquidated damages without proof of loss"*

    - name: "Issue Analysis"
      apiKey: "nyayai-research-key"
      baseURL: "http://host.docker.internal:8106/v1"
      headers:
        X-LibreChat-Session: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        X-LibreChat-User: '{{LIBRECHAT_USER_ID}}'
      models:
        default: ["nyay-issue-analysis"]
        fetch: false
      modelDisplayLabel: "Issue Analysis"
      titleConvo: true
      titleModel: "nyay-issue-analysis"
      summarize: false
      forcePrompt: false
      dropParams:
        - user
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      addParams:
        max_tokens: 16000
        stream: true
      description: |
        Full five-step research workflow for any complex legal matter — applicable law, verified precedents, synthesis of the current position, strategic options, and recommended approach.
        Anchors every proposition to the verified case law pipeline and flags conflicting or overruled authorities.
        Use for deep pre-litigation assessment, advisory opinions, or preparing written arguments on a contested legal issue.
        Delivers a structured strategy memo, not just a list of citations.
      greeting: |
        ⚖️ **Issue Analysis**

        Full five-step research workflow for complex matters.

        Describe the matter — facts, forum, relief sought — and I'll deliver:
        1. Applicable law and statutory framework
        2. Verified precedents (three-source pipeline)
        3. Legal synthesis and current position
        4. Strategic options with strength/risk assessment
        5. Recommended approach

    - name: "Writ Jurisdiction"
      apiKey: "nyayai-research-key"
      baseURL: "http://host.docker.internal:8106/v1"
      headers:
        X-LibreChat-Session: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        X-LibreChat-User: '{{LIBRECHAT_USER_ID}}'
      models:
        default: ["nyay-writ"]
        fetch: false
      modelDisplayLabel: "Writ Jurisdiction"
      titleConvo: true
      titleModel: "nyay-writ"
      summarize: false
      forcePrompt: false
      dropParams:
        - user
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      addParams:
        max_tokens: 16000
        stream: true
      description: |
        Maintainability analysis for Article 226 (High Court) and Article 32 (Supreme Court) writ petitions.
        Covers the alternate remedy bar, locus standi, delay and laches, and the appropriate writ type for the relief claimed.
        Flags jurisdictional pitfalls before filing and maps the relief sought to the correct writ form.
        Use to assess whether your matter is fit for the writ jurisdiction before briefing counsel.
      greeting: |
        ⚖️ **Writ Jurisdiction**

        Maintainability analysis for Article 226 (High Court) and Article 32 (Supreme Court) writ petitions.

        Describe the impugned action, the petitioner, and the relief sought — I'll analyse maintainability, alternate remedy bar, delay, and recommend the appropriate writ.

    - name: "Criminal Law"
      apiKey: "nyayai-research-key"
      baseURL: "http://host.docker.internal:8106/v1"
      headers:
        X-LibreChat-Session: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        X-LibreChat-User: '{{LIBRECHAT_USER_ID}}'
      models:
        default: ["nyay-criminal"]
        fetch: false
      modelDisplayLabel: "Criminal Law"
      titleConvo: true
      titleModel: "nyay-criminal"
      summarize: false
      forcePrompt: false
      dropParams:
        - user
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      addParams:
        max_tokens: 16000
        stream: true
      description: |
        Research under both Indian criminal law regimes — BNSS 2023 / BNS 2023 / BSA 2023 for offences on or after 1 July 2024, and CrPC / IPC / Evidence Act for earlier offences.
        Covers bail jurisprudence (anticipatory, regular, and statutory bail), FIR validity, charge sustainability, and quashing under s.482 CrPC / s.528 BNSS.
        Every proposition is anchored to verified Supreme Court and High Court authorities.
        Use for bail applications, charge-framing challenges, quashing petitions, and trial strategy research.
      greeting: |
        ⚖️ **Criminal Law**

        Research under BNSS 2023 / BNS 2023 / BSA 2023 (post-July 2024) and CrPC / IPC / Evidence Act (pre-July 2024).

        Describe the matter — FIR details, stage (bail/charge/trial/quashing), offence section — and I'll provide a structured research memo with verified authorities.

    - name: "Commercial Disputes"
      apiKey: "nyayai-research-key"
      baseURL: "http://host.docker.internal:8106/v1"
      headers:
        X-LibreChat-Session: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        X-LibreChat-User: '{{LIBRECHAT_USER_ID}}'
      models:
        default: ["nyay-commercial"]
        fetch: false
      modelDisplayLabel: "Commercial Disputes"
      titleConvo: true
      titleModel: "nyay-commercial"
      summarize: false
      forcePrompt: false
      dropParams:
        - user
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      addParams:
        max_tokens: 16000
        stream: true
      description: |
        Research for contract disputes, arbitration, injunctions, and commercial court matters under Indian law.
        Covers the Indian Contract Act 1872, Arbitration and Conciliation Act 1996, specific performance, interim injunction standards (balance of convenience / irreparable harm), limitation, and the Commercial Courts Act.
        Applicable to disputes before Civil Courts, Commercial Courts, NCLT, and arbitral tribunals.
        Use for pre-litigation assessment, arbitration clause analysis, or preparing arguments on any commercial dispute.
      greeting: |
        ⚖️ **Commercial Disputes**

        Research for contract disputes, arbitration, injunctions, and commercial court matters.

        Describe the dispute — contract type, forum (Civil Court / Commercial Court / Arbitration / DIAC / SIAC), relief sought — and I'll provide a research memo with applicable law and verified case law.

    - name: "Constitutional Law"
      apiKey: "nyayai-research-key"
      baseURL: "http://host.docker.internal:8106/v1"
      headers:
        X-LibreChat-Session: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        X-LibreChat-User: '{{LIBRECHAT_USER_ID}}'
      models:
        default: ["nyay-constitutional"]
        fetch: false
      modelDisplayLabel: "Constitutional Law"
      titleConvo: true
      titleModel: "nyay-constitutional"
      summarize: false
      forcePrompt: false
      dropParams:
        - user
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      addParams:
        max_tokens: 16000
        stream: true
      description: |
        Research on fundamental rights (Articles 12–35), proportionality doctrine, Article 14 arbitrariness review, PIL maintainability, and legislative competence.
        Covers landmark Supreme Court constitutional bench decisions and the current doctrinal position on judicial review of executive and legislative action.
        Use for writ petitions challenging state action, policy, or legislation, or for advisory opinions on constitutional validity.
        Every authority is tagged by bench composition and constitutional bench status.
      greeting: |
        ⚖️ **Constitutional Law**

        Research on fundamental rights, proportionality doctrine, judicial review, and PIL.

        Describe the constitutional question — article invoked, state action challenged, petitioner — and I'll analyse the constitutional position with landmark authorities.

    - name: "Argument Stress Test"
      apiKey: "nyayai-research-key"
      baseURL: "http://host.docker.internal:8106/v1"
      headers:
        X-LibreChat-Session: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        X-LibreChat-User: '{{LIBRECHAT_USER_ID}}'
      models:
        default: ["nyay-stress-test"]
        fetch: false
      modelDisplayLabel: "Argument Stress Test"
      titleConvo: true
      titleModel: "nyay-stress-test"
      summarize: false
      forcePrompt: false
      dropParams:
        - user
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      addParams:
        max_tokens: 16000
        stream: true
      description: "Stress-test your legal argument — find every contra case, score proposition vulnerabilities HIGH/MEDIUM/SECURE, build the opponent's playbook, and get a concrete fortification plan."
      greeting: |
        ⚖️ **Argument Stress Test**

        Paste your argument and I'll find every case that cuts against it.

        I'll decompose your argument into propositions, run contra-framed searches across the SC judgment corpus, score each proposition's vulnerability, build the opponent's likely playbook, and give you a concrete fortification plan for every weak point — before the hearing.

        Paste your written submission or bullet-point argument to begin.

    # ── Litigation ─────────────────────────────────────────────────────────────
    # All 8 skills route to NyayAI-Litigation-v1 backend (port 8105).
    # The "model" slug selects the SKILL.md and LLM tier (simple/medium/complex).

    - name: "Practice Setup"
      apiKey: "nyayai-litigation-key"
      baseURL: "http://host.docker.internal:8105/v1"
      headers:
        X-LibreChat-Session: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        X-LibreChat-User: '{{LIBRECHAT_USER_ID}}'
      models:
        default: ["nyay-cold-start"]
        fetch: false
      modelDisplayLabel: "Practice Setup"
      group: "Litigation"
      titleConvo: true
      summarize: false
      forcePrompt: false
      dropParams:
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      description: |
        Set up your firm's litigation practice profile — the foundation for every NyayAI skill.
        Provide your practice areas, courts, risk thresholds, escalation norms, and citation style in a guided interview.
        NyayAI calibrates every skill output — risk ratings, flag levels, and drafting tone — against this profile.
        Run once when you first onboard, or whenever your practice focus changes significantly.
      greeting: |
        Welcome to Practice Setup!

        I'll walk you through setting up your NyayAI litigation profile.

        Tell me about your practice — are you a firm advocate, in-house counsel, or solo advocate?
        Which courts do you primarily appear in?

        Type **"start"** to begin, or **"--redo"** to overwrite an existing profile.

    - name: "Case Intake"
      apiKey: "nyayai-litigation-key"
      baseURL: "http://host.docker.internal:8105/v1"
      headers:
        X-LibreChat-Session: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        X-LibreChat-User: '{{LIBRECHAT_USER_ID}}'
      models:
        default: ["nyay-matter-intake"]
        fetch: false
      modelDisplayLabel: "Case Intake"
      group: "Litigation"
      titleConvo: true
      summarize: false
      forcePrompt: false
      dropParams:
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      description: |
        Register a new matter and build the initial case file.
        Provide the client's instructions, key facts, parties, court, and cause of action — NyayAI identifies the limitation date, runs a conflicts check, and flags early risk signals.
        The case is saved to your portfolio and becomes available to all active-litigation skills.
        Every skill that works on a specific matter depends on a completed Case Intake entry.
      greeting: |
        Welcome to Case Intake!

        Tell me about the new case — client name, what happened, and what relief is sought.

        I'll ask follow-up questions to capture: conflicts clearance, risk triage, limitation deadline, outside advocate, and key dates.

    - name: "Case Update"
      apiKey: "nyayai-litigation-key"
      baseURL: "http://host.docker.internal:8105/v1"
      headers:
        X-LibreChat-Session: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        X-LibreChat-User: '{{LIBRECHAT_USER_ID}}'
      models:
        default: ["nyay-matter-update"]
        fetch: false
      modelDisplayLabel: "Case Update"
      group: "Litigation"
      titleConvo: true
      summarize: false
      forcePrompt: false
      dropParams:
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      description: |
        Record what happened at a hearing, conference, or in-chambers event.
        Update the next hearing date, log orders passed, and note any new evidence or witnesses.
        NyayAI appends the update to the case history and recalculates stale risk or limitation flags.
        Keep this current after every court appearance to maintain an accurate portfolio view.
      greeting: |
        Welcome to Case Update!

        Which case are you updating? Give me the case slug (e.g. **"sharma-vs-abc-2025"**) and what happened — hearing outcome, new pleading served, court order received.

    - name: "Portfolio Status"
      apiKey: "nyayai-litigation-key"
      baseURL: "http://host.docker.internal:8105/v1"
      headers:
        X-LibreChat-Session: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        X-LibreChat-User: '{{LIBRECHAT_USER_ID}}'
      models:
        default: ["nyay-portfolio"]
        fetch: false
      modelDisplayLabel: "Portfolio Status"
      group: "Litigation"
      titleConvo: true
      summarize: false
      forcePrompt: false
      dropParams:
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      description: |
        See a risk-rated overview of your entire active litigation portfolio.
        Surfaces hearing dates in the next 60 days, approaching limitation cliffs, preservation notice gaps, and matters that have gone stale since the last update.
        Critical items appear at the top with a suggested action for each.
        Use as your daily or weekly practice health check — nothing falls through the gaps.
      greeting: |
        Welcome to Portfolio Status!

        I'll pull up your full matter portfolio from _log.yaml.

        Options:
        - **"Show portfolio"** — full rollup
        - **"Critical only"** — high-risk + limitation alarms only
        - **"Limitation dashboard"** — deadlines ranked by urgency

    - name: "Case Chronology"
      apiKey: "nyayai-litigation-key"
      baseURL: "http://host.docker.internal:8105/v1"
      headers:
        X-LibreChat-Session: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        X-LibreChat-User: '{{LIBRECHAT_USER_ID}}'
      models:
        default: ["nyay-chronology"]
        fetch: false
      modelDisplayLabel: "Case Chronology"
      group: "Litigation"
      titleConvo: true
      summarize: false
      forcePrompt: false
      dropParams:
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      description: |
        Build a structured fact chronology for a matter, mapped to the applicable legal elements.
        Events are ordered chronologically and tagged by relevance to the cause of action, defences, or relief claimed.
        Gaps and unexplained intervals are flagged for follow-up.
        Outputs in three formats: working chronology, List of Dates (for petitions), or Statement of Facts.
      greeting: |
        Welcome to Case Chronology!

        Give me the matter slug and I'll extract a dated chronology from your matter documents.

        Formats available: **working** (internal), **lod** (List of Dates for petition), **sof** (Statement of Facts).

        Example: **"Build chronology for sharma-vs-abc-2025 --format=lod"**

