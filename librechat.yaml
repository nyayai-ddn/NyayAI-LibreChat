        Provide the legal issue, your factual matrix, and the relief sought — NyayAI drafts in proper legal style with cited propositions tagged [verify].
        Covers writ petitions, appeals, written arguments, SLPs, and written statements.
        All criminal provisions are verified against the BNS/BNSS supersession table before inclusion.
