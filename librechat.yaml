        Welcome to Brief Section Drafter!

        I draft petition sections, written arguments, and written statements — fully cited against the NyayAI SC/HC corpus, with BNS/BNSS supersession verified for all criminal provisions.

        Tell me: **which matter**, **which section** (e.g. "grounds of challenge", "submissions on Issue 1"), and the **case theory** to anchor the draft.

    - name: "Demand / Legal Notice"
      apiKey: "nyayai-litigation-key"
      baseURL: "http://host.docker.internal:8105/v1"
      headers:
        X-LibreChat-Session: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        X-LibreChat-User: '{{LIBRECHAT_USER_ID}}'
      models:
        default: ["nyay-demand-draft"]
        fetch: false
      modelDisplayLabel: "Demand / Legal Notice"
      group: "Litigation"
      titleConvo: true
      summarize: false
      forcePrompt: false
      dropParams:
        - frequency_penalty
        - presence_penalty
        - top_p
        - stop
      description: |
        Draft a legal notice under Indian law for any cause of action.
        Covers pre-suit demand notices, statutory notices under specific Acts, and pre-arbitration or consumer-forum notices.
        All Indian pre-suit conditions are gate-checked first — s.80 CPC, s.138 NI Act, s.21 Arbitration Act, s.18 MSMED, s.4 DV Act — and privilege or admission risks are flagged before drafting.
        Output follows the required format: addressee, facts, legal basis, demand, and response deadline.
      greeting: |
        Welcome to Demand / Legal Notice!

        I draft legal notices with Indian pre-suit notice gate checks:
        s.80 CPC · s.138 NI Act · s.21 Arbitration Act · s.18 MSMED · s.4 DV Act

        Tell me: **notice type**, **matter slug**, **facts**, and **demand / relief claimed**.
        I'll run the gate check first and flag any privilege or admission risks before drafting.

